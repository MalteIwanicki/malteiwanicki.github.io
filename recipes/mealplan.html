<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Book</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-header__titles">
          <h1>Recipe Book :)</h1>
          <p class="site-header__subtitle">
            Pick your meals, get a shopping list.
          </p>
        </div>
        <div class="site-header__actions">
          <a
            href="tampermonkey_script.js"
            id="setupButton"
            class="btn btn--ghost"
          >
            Setup
          </a>

          <div class="auth-widget" id="auth-widget">
            <button
              id="auth-signin"
              class="btn btn--primary"
              type="button"
              hidden
            >
              Sign in with Google
            </button>
            <div id="auth-user" class="auth-user" hidden>
              <span class="auth-user__avatar">
                <img
                  id="auth-user-photo"
                  class="auth-user__photo"
                  alt=""
                  referrerpolicy="no-referrer"
                />
                <span
                  id="auth-user-initials"
                  class="auth-user__initials"
                ></span>
              </span>
              <span id="auth-user-name" class="auth-user__name"></span>
              <button id="auth-signout" class="btn btn--ghost" type="button">
                Sign out
              </button>
            </div>
          </div>
        </div>
      </div>
      <p id="auth-message" class="auth-message" hidden></p>
    </header>

    <main class="layout">
      <section class="recipes-column">
        <div class="recipes-toolbar">
          <h2 class="section-title">Recipes</h2>
          <span id="selected-count" class="pill">0 selected</span>
        </div>
        <div id="recipes-container"></div>
      </section>

      <aside id="summary-panel">
        <div class="summary-header">
          <h2>Summary</h2>
          <button
            id="copy-summary-button"
            type="button"
            class="btn btn--primary"
          >
            Copy shopping list
          </button>
        </div>
        <div id="summary-list"></div>
      </aside>
    </main>

    <footer>
      <p>&copy; 2024 Recipe Book</p>
    </footer>

    <script src="scripts.js"></script>
    <script type="module" src="auth.js"></script>

    <div id="access-denied-overlay" class="access-denied" hidden>
      <div class="access-denied__card">
        <h2>Private app</h2>
        <p>
          This is a private app, contact Malte at
          <a href="mailto:malteiwa+mealplan@gmail.com"
            >malteiwa+mealplan@gmail.com</a
          >
          to get access.
        </p>
      </div>
    </div>
  </body>
</html>
